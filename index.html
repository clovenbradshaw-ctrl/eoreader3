<body>
<div id="root"></div>

<!-- compromise.js — POS-tagged parsing for the engine. Pinned to an exact
     version (not a floating major) so a silent upstream change can't shift the
     extractor's output and break the golden-parity contract. Matches the
     version the Node test harness resolves. Add an SRI integrity hash when
     regenerating against this exact file. -->
<script src="https://cdn.jsdelivr.net/npm/compromise@14.15.1/builds/compromise.min.js"></script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- engine (plain scripts; expose window.EOEngine / window.EOLLM / window.EOStore / window.EOAudit) -->
<script src="engine.js"></script>
<script src="llm.js"></script>
<!-- the conventions graph: everything human-language-specific, as an
     eo-operation log (see the CONVENTIONS GRAPH note in engine.js). Loaded
     opportunistically; absent/unreachable (file://) the engine's seeds apply
     and behavior is identical — the drift test pins file == seeds. -->
<script>
  fetch('memory/conventions.jsonl').then(r => r.ok ? r.text() : null).then(t => {
    if (t && window.EOEngine && window.EOEngine.loadConventions) window.EOEngine.loadConventions(t);
  }).catch(() => {});
  // Hydration writer: when a record ADMITS (an eva neuron's two sightings, or
  // a proposed convention clearing θ_admit with independent witnesses — never
  // every stumble or signal), append it to the durable graph via the
  // conventions webhook. Ships only the convention record — anchors are
  // content hashes + embedding signatures, never document content; the
  // engine strips signatures too when EO_ANCHOR_PRIVATE = 'strict'. The
  // dedup key (op + target + anchor-hash set) lets the webhook commit each
  // admission exactly once however many sessions re-ship it. Clear
  // EO_CONVENTIONS_ENDPOINT to keep memory strictly local.
  window.EO_CONVENTIONS_ENDPOINT = window.EO_CONVENTIONS_ENDPOINT
    || 'https://n8n.intelechia.com/webhook/eoreader3/conventions/append';
  // window.EO_ANCHOR_PRIVATE = 'strict';   // coupling-only off-device
  if (window.EOEngine) window.EOEngine.onConventionsRec = (rec) => {
    if (!rec || !rec.admitted || !window.EO_CONVENTIONS_ENDPOINT) return;
    const hs = Array.isArray(rec.prov) ? rec.prov.map(a => a && a.h).filter(Boolean).sort() : [];
    const what = (rec.value && (rec.value.term || rec.value.statement || rec.value.reason)) || rec.target || rec.op;
    fetch(window.EO_CONVENTIONS_ENDPOINT, {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        line: rec,
        dedup: rec.op + '|' + (rec.target || rec.id || '') + '|'
          + (hs.length ? hs.join(',') : String((rec.value && (rec.value.term || rec.value.pid)) || '')),
        message: 'hydrate: ' + (rec.action || rec.op) + ' "' + String(what).slice(0, 80) + '"',
      }),
    }).catch(() => {});
  };
</script>
<script src="embed.js"></script>
<script src="store.js"></script>
<script src="audit.js"></script>

<!-- evo sandbox (dev-only): bundled constitution + in-browser evolution loop, plus the

</body>
