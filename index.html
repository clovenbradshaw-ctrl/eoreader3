<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- viewport-fit=cover lets the page extend under the notch/home indicator so
     the safe-area-inset() padding in styles.css can keep content clear of them;
     interactive-widget=resizes-content shrinks the layout for the soft keyboard. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#ffffff" />
<meta name="color-scheme" content="light" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Cleo" />
<title>Cleo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- model CDNs: the WebLLM/wllama runtimes (jsdelivr) and the on-device CPU
     model weights (Hugging Face). Pre-connecting shaves the first-load handshake. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="preconnect" href="https://huggingface.co" crossorigin />
<!-- esm.run serves the WebLLM runtime (llm.js imports it on first GPU load).
     Preconnecting it warms the DNS+TLS handshake so a slow/VPN'd first load
     doesn't pay it serially when the import begins (see EOLLM.primePump). -->
<link rel="preconnect" href="https://esm.run" crossorigin />
<!-- NOTE: the on-device CPU model (wllama / llama.cpp in WebAssembly) runs
     single-threaded out of the box. To unlock multi-threaded CPU inference it
     needs SharedArrayBuffer, which requires cross-origin isolation — serve the
     app with `Cross-Origin-Opener-Policy: same-origin` and
     `Cross-Origin-Embedder-Policy: require-corp`. Absent those headers it simply
     falls back to single-thread; nothing breaks. -->
<!-- Quill — the rich-text editor behind the composition surface (Google-Docs
     feel: a toolbar + markdown shortcuts). Pinned to an exact version; loaded
     before styles.css so the app's theme can override the snow stylesheet. The
     editor degrades to a plain textarea wherever window.Quill is absent. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" />
<link rel="stylesheet" href="styles.css" />
<!-- Theme, before first paint. Reads the persisted UI prefs (the same
     localStorage key store.js writes) and pins <html data-theme> so the
     palette is right on the very first frame — no light-to-dark flash. The
     app re-applies and keeps it in sync once React mounts (settings.jsx). -->
<script>
  (function () {
    try {
      var p = JSON.parse(localStorage.getItem('cleo.prefs') || '{}') || {};
      var t = p.theme || 'system';
      var dark = t === 'dark' || (t !== 'light' && window.matchMedia
        && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      if (p.reduceMotion) document.documentElement.classList.add('reduce-motion');
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="root"></div>

<!-- compromise.js — POS-tagged parsing for the engine. Pinned to an exact
     version (not a floating major) so a silent upstream change can't shift the
     extractor's output and break the golden-parity contract. Matches the
     version the Node test harness resolves. Add an SRI integrity hash when
     regenerating against this exact file. -->
<script src="https://cdn.jsdelivr.net/npm/compromise@14.15.1/builds/compromise.min.js"></script>

<!-- math.js — the deterministic evaluator behind the chat's calculator
     (window.EOCompute / compute.js). UMD bundle, exposes window.math; pinned to
     an exact version (matches the version the Node test harness resolves) so the
     in-browser arithmetic and the tested arithmetic stay identical. Library code
     only — no document data leaves the browser. Add an SRI integrity hash when
     regenerating against this exact file. -->
<script src="https://cdn.jsdelivr.net/npm/mathjs@13.2.3/lib/browser/math.js"></script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Quill (window.Quill) + its markdown-shortcuts module (window.QuillMarkdown),
     the rich-text editor for the composition surface. Pinned to exact versions;
     library code only, no document data leaves the browser. compose.jsx uses it
     when present and falls back to a textarea when it isn't. -->
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
<script src="https://cdn.jsdelivr.net/npm/quilljs-markdown@1.2.0/dist/quilljs-markdown.js"></script>

<!-- engine (plain scripts; expose window.EOEngine / window.EOLLM / window.EOStore / window.EOAudit / window.EOPython / window.EOCompute) -->
<script src="engine.js"></script>
<script src="llm.js"></script>
<!-- Self-hosting a WebLLM model from a single zip (window.EO_WEBLLM_SELFHOST):
     map a model key → a .zip of its weights on your own bucket. The app then
     streams that ONE resumable download, unzips it into a Cache, and sw.js
     serves the files to WebLLM — instead of ~30 separate shard requests that a
     slow/VPN'd link keeps stalling on. Any failure falls back to the normal
     Hugging Face load, so it can only help. The bucket must send open CORS
     (access-control-allow-origin) and the app must be served over https (a
     service worker needs it). Off by default — it routes ALL loads of that
     model through the single-stream + main-thread path, which a fast connection
     doesn't need — so uncomment to enable for your deployment:
<script>
  window.EO_WEBLLM_SELFHOST = {
    'Llama-3.2-3B-Instruct-q4f16_1-MLC':
      'https://storage.googleapis.com/intelechia-content/Llama-3.2-3B-Instruct-q4f16_1-MLC.zip',
  };
</script>
-->

<!-- the conventions graph: everything human-language-specific, as an
     eo-operation log (see the CONVENTIONS GRAPH note in engine.js). Loaded
     opportunistically; absent/unreachable (file://) the engine's seeds apply
     and behavior is identical — the drift test pins file == seeds. -->
<script>
  fetch('memory/conventions.jsonl').then(r => r.ok ? r.text() : null).then(t => {
    if (t && window.EOEngine && window.EOEngine.loadConventions) window.EOEngine.loadConventions(t);
  }).catch(() => {});
  // Per-register convention packs (memory/packs/) load as an ADDITIVE channel,
  // separate from conventions.jsonl so the drift test (file == seeds) is
  // untouched. INDEX.jsonl names the fragments; each is loaded through
  // loadConventionPacks — today el-classical-v1, which carries the Greek
  // reading organs (stem fold / case→role / bound pronoun). Absent or
  // unreachable (file://), packs simply don't load and behavior is unchanged.
  fetch('memory/packs/INDEX.jsonl').then(r => r.ok ? r.text() : '').then(idx => {
    const homes = idx.split(/\r?\n/).map(l => { try { return JSON.parse(l).home; } catch (e) { return null; } })
      .filter(h => h && h.indexOf('memory/packs/') === 0);
    for (const h of [...new Set(homes)]) {
      fetch(h).then(r => r.ok ? r.text() : null).then(t => {
        if (t && window.EOEngine && window.EOEngine.loadConventionPacks) window.EOEngine.loadConventionPacks(t);
      }).catch(() => {});
    }
  }).catch(() => {});
  // Hydration writer: when an EVA failure ADMITS a term (two sightings — a
  // contextual neuron, not every stumble) or a PROPOSED convention clears
  // admission (an independent witness past θ), append its record(s) to the
  // durable graph via the conventions webhook. Ships only convention records
  // — anchors carry opaque hashes, never document content or locations; set
  // window.EO_ANCHOR_PRIVATE = 'strict' (before this script) to also strip
  // embedding signatures from shipped anchors. Clear EO_CONVENTIONS_ENDPOINT
  // to keep memory strictly local.
  window.EO_CONVENTIONS_ENDPOINT = window.EO_CONVENTIONS_ENDPOINT
    || 'https://n8n.intelechia.com/webhook/eoreader3/conventions/append';
  if (window.EOEngine) window.EOEngine.onConventionsRec = (rec) => {
    if (!rec || !rec.admitted || !window.EO_CONVENTIONS_ENDPOINT) return;
    var what = (rec.value && (rec.value.term || rec.value.reason))
      ? 'eva neuron "' + (rec.value.term || rec.value.reason) + '"'
      : 'convention ' + (rec.id || rec.target || rec.o || rec.op);
    fetch(window.EO_CONVENTIONS_ENDPOINT, {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ line: rec, message: 'hydrate: ' + what }),
    }).catch(() => {});
  };
</script>
<script src="embed.js"></script>
<script>
  // Provenance anchors borrow the resident MiniLM for their embedding
  // signatures — but only once it is already loaded for retrieval/recall
  // (ready()), so a proposal never silently triggers a model download.
  // Without sigs the anchor physics degrades to coupling-only, by design.
  if (window.EOEngine && window.EOEngine.setAnchorEmbedder) {
    window.EOEngine.setAnchorEmbedder((texts) =>
      (window.EOEmbed && window.EOEmbed.ready()) ? window.EOEmbed.embedSentences(texts) : null);
  }
</script>
<!-- the adapter library (window.EOAdapters): perceptual / parsing / embedding
     models behind ONE contract, offered to packs by capability and to the user
     through Settings → Models & adapters. Contract + registry load first, then
     one plain script per adapter. Each script only REGISTERS its manifest at
     load (cheap, no network); the underlying model/parser (tesseract.js,
     transformers.js, pdf.js, tree-sitter) downloads lazily from a CDN
     index.html already trusts, and only on first actual use. These must load
     before the UI so the picker can read the registry. -->
<script src="adapters/contract.js"></script>
<script src="adapters/registry.js"></script>
<script src="adapters/ocr/tesseract.js"></script>
<script src="adapters/ocr/trocr.js"></script>
<script src="adapters/asr/whisper.js"></script>
<script src="adapters/parse/pdfjs.js"></script>
<script src="adapters/parse/papaparse.js"></script>
<script src="adapters/parse/treesitter.js"></script>
<script src="adapters/layout/docling-lite.js"></script>
<script src="adapters/embed/minilm.js"></script>
<script src="adapters/embed/clip.js"></script>
<!-- faithful import (window.EOImportStructure): reconstructs words, lines,
     columns, reading order and furniture from positioned-event geometry, and
     the layout/content firewall. Loads before the bridge that uses it. -->
<script src="import-structure.js"></script>
<!-- the perceptual-ingest bridge (window.EOIngestAdapters): the pack-side glue
     that routes a dropped audio/image/PDF file to its adapter and folds the
     adapter's events back into the text the engine reads. -->
<script src="ingest-adapters.js"></script>
<!-- the shape layer (shape-steered generation): the exemplar library + the
     drafting controller, discriminative score, and interpretable axes. -->
<script src="shape.js"></script>
<script>
  // The shape library is fetched once and embedded LAZILY on first request,
  // borrowing the resident MiniLM (the same embedder used for recall) so an
  // exemplar vector never triggers a model download and startup pays nothing
  // until something asks. Returns a memoized Promise<library|null>; absent or
  // unreachable (file://, no embedder) it resolves null and callers fall back
  // to the single-call phrasing path (parity).
  (function () {
    let p = null;
    window.EOShapeLibrary = function () {
      if (p) return p;
      p = (async () => {
        try {
          if (!window.EOShape) return null;
          const res = await fetch('exemplars.jsonl');
          if (!res.ok) return null;
          const text = await res.text();
          const embed = (texts) => (window.EOEmbed && window.EOEmbed.embedSentences)
            ? window.EOEmbed.embedSentences(texts) : null;
          return await window.EOShape.load(text, embed);
        } catch (e) { return null; }
      })();
      return p;
    };
    // The SECOND library: form genres (how a news article / obituary / recipe
    // LOOKS), kept apart from Cleo's voice on purpose — its discriminative score
    // pulls competitors from the other GENRES, never from assistant-voice moves.
    // Same loader, same lazy MiniLM embed, same parity fallback (resolves null
    // when absent/unreachable). Empty until tools/form-genres/fetch.mjs fills it.
    let fp = null;
    window.EOFormLibrary = function () {
      if (fp) return fp;
      fp = (async () => {
        try {
          if (!window.EOShape) return null;
          const res = await fetch('form-genres.jsonl');
          if (!res.ok) return null;
          const text = await res.text();
          const embed = (texts) => (window.EOEmbed && window.EOEmbed.embedSentences)
            ? window.EOEmbed.embedSentences(texts) : null;
          return await window.EOShape.load(text, embed);
        } catch (e) { return null; }
      })();
      return fp;
    };
  })();
</script>
<script src="store.js"></script>
<script src="audit.js"></script>
<!-- the composition layer (window.EOComposition): the turn-scale grounded loop
     lifted to the scale of a long document. A pure, dependency-injected event
     log + fold + grain-relative witness + form stamp + monitor; the talker,
     embedder, retriever and form library are passed in by compose.jsx. Inert
     until a composition doc is opened — the engine behaves identically without
     one. -->
<script src="composition.js"></script>
<!-- the addressee field (window.EOAddressee): the SECOND person. A chat-scoped
     overlay over the reader's own reading that marks, per span/entity/claim, what
     the EXCHANGE has established the person has of it (the conversational common
     ground), with a false-belief-separated Meant-Graph for what the person
     believes. Pure and dependency-injected (the decay γ and resolveBinding are
     passed in by app.jsx). Inert until addressee_field is ON — the engine and the
     chat field behave identically without it (the parity floor). -->
<script src="addressee.js"></script>
<!-- computational grounding: an opt-in, manually-gated second mechanical source
     (Pyodide in a Web Worker) for questions the prose engine structurally can't
     answer — sum a column, count rows, join two CSVs. Off by default; the
     runtime loads from cdn.jsdelivr.net only on the first actual run, never at
     page load. Network egress from executed Python is blocked. -->
<script src="pyodide.js"></script>
<!-- deterministic arithmetic (window.EOCompute): detects a math turn, evaluates
     it with math.js, and binds figures to the lines they came from. Inert until
     a turn is actually a calculation. -->
<script src="compute.js"></script>
<script src="enrich.js"></script>
<!-- schema-aware table query: turns "clients from Mexico" into a real filter by
     reading the loaded table's own columns & values (window.EOTableQuery). -->
<script src="tablequery.js"></script>
<!-- the external-knowledge stratum: an opt-in reference desk (Wikipedia +
     Wiktionary) through the proxy, rate-limited and prioritised. Inert unless
     window.EO_REFERENCE_PROXY resolves; clear it to keep the reader local. -->
<script src="external.js"></script>
<!-- web sources (window.EOWebSource): external web documents admitted as
     first-class groundable sources through the same pipeline an uploaded doc
     travels. A deep-read action, never a chat affordance; the local model can
     only PROPOSE a query, never fetch. Inert unless window.EO_SEARCH_PROXY
     resolves (a self-hosted SearXNG behind the cleon-search-proxy); clear it to
     keep the reader strictly local. See docs/web-source-admission.md. -->
<script src="websource.js"></script>
<!-- prompt-flow registry: the machine-readable map of how a turn becomes a model
     call, with every prompt string read LIVE from llm.js (window.EOPromptFlow).
     Pure data + live reads; loads no model. Backs the Prompt-flow dashboard. -->
<script src="promptflow.js"></script>

<!-- UI (Babel/JSX) -->
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="pivot.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="sidebar.jsx"></script>
<script type="text/babel" src="chat.jsx"></script>
<script type="text/babel" src="reference.jsx"></script>
<script type="text/babel" src="docview.jsx"></script>
<script type="text/babel" src="compose.jsx"></script>
<script type="text/babel" src="rulesets.jsx"></script>
<script type="text/babel" src="auditview.jsx"></script>
<!-- EO-MRI: the cognition instrument beside the Glass box — the EO cube's three
     faces (operators · site · resolution) and the operator(site, resolution)
     address, scanned live as a turn runs (window.EOMRIDrawer). See docs/eo-mri.md. -->
<script type="text/babel" src="eomri.jsx"></script>
<script type="text/babel" src="graphaudit.jsx"></script>
<script type="text/babel" src="promptflow.jsx"></script>
<script type="text/babel" src="settings.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
